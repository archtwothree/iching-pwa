<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7c95c">
  <meta name="description" content="A bright, offline-first I Ching coin casting PWA.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <title>I Ching Oracle</title>
</head>
<body>
  <header class="hero">
    <div class="brand-mark" aria-hidden="true">☯</div>
    <div>
      <div class="brand-title">I CHING</div>
      <div class="brand-subtitle">ORACLE</div>
    </div>
  </header>

  <main>
    <section id="question-screen" class="screen active">
      <div class="section-label">YOUR QUESTION</div>
      <textarea id="question" maxlength="500" placeholder="Write your question here...\n\nTaking a moment to write it down can help you focus."></textarea>
      <div class="helper"><span id="char-count">0</span>/500</div>

      <div class="intro-card">
        <h2>Cast the coins six times</h2>
        <p>The virtual coins are generated on your device. The basic casting works offline.</p>
      </div>

      <button id="start-cast" class="primary-btn">🪙 THROW COINS VIRTUALLY</button>
      <button id="real-coins" class="secondary-btn">🪙 ENTER REAL COINS</button>
      <button id="history-home" class="text-btn">📖 My Readings</button>
    </section>

    <section id="casting-screen" class="screen">
      <div class="cast-head">
        <div class="section-label">CASTING</div>
        <div id="throw-count" class="throw-count">THROW 1 OF 6</div>
      </div>

      <div class="coins-stage" id="coins-stage" aria-live="polite">
        <div class="coin">🪙</div><div class="coin">🪙</div><div class="coin">🪙</div>
      </div>
      <div id="coin-result" class="coin-result"></div>

      <div id="hexagram-builder" class="hexagram-builder"></div>

      <button id="throw-btn" class="primary-btn">THROW COINS</button>
      <button id="back-home" class="text-btn">← Cancel</button>
    </section>

    <section id="result-screen" class="screen">
      <div class="section-label">YOUR CAST</div>
      <div id="result-question" class="question-card"></div>

      <div class="hex-card">
        <div class="hex-symbol" id="primary-symbol">䷀</div>
        <div class="hex-number" id="primary-number"></div>
        <h1 id="primary-name"></h1>
        <div id="primary-lines" class="large-lines"></div>
      </div>

      <div id="changing-card" class="info-card"></div>

      <div class="hex-card relating-card" id="relating-card"></div>

      <div class="result-actions">
        <button id="save-reading" class="primary-btn">SAVE READING</button>
        <button id="new-reading" class="secondary-btn">NEW READING</button>
      </div>
    </section>

    <section id="history-screen" class="screen">
      <div class="section-label">MY READINGS</div>
      <div id="history-list"></div>
      <button id="history-back" class="text-btn">← Back</button>
    </section>
  </main>

  <footer>Offline-first • Coin casting happens on this device</footer>

  <script src="js/hexagrams.js"></script>
  <script src="js/casting.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
